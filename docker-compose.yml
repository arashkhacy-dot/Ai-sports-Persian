version: '3.8'

services:
  sportscaster:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: persian_ai_sportscaster
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./data:/app/data
      - ./hls_live:/app/public/live
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/public/channel"]
      interval: 30s
      timeout: 10s
      retries: 3
